server {
    listen 80;
    server_name _;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1k;

    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location = /healthz { 
        return 200 'ok';
    }
}